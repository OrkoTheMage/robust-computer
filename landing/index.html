      title="Robust Computer — Field Notes"
      href="/rss.xml"
    />
    <!-- Self-hosted fonts. Preload the weights used on first paint
         so font-display: optional resolves to the real font within
         the 100ms block period (and we never fall back to a system
         mono whose zero glyph doesn't have the IBM Plex slash). -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/ibm-plex-mono-700.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/ibm-plex-mono-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/barlow-800.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/newsreader.woff2" crossorigin />
    <title>Robust Computer</title>
  </head>
